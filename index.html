<style>
  #cornerBtn {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 44px;
    height: 44px;
    border-radius: 9999px;
    border: 1px solid #1f2937;
    background: #2563eb;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,.25);
    z-index: 10000;
  }

  #popupOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: white;
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }

  #popupImage {
    max-width: 95%;
    max-height: 95%;
    object-fit: contain;
  }

  #closePopup {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 24px;
    background: #2563eb;
    color: white;
    border: none;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
  }
</style>

<button id="cornerBtn">⋮</button>

<div id="popupOverlay">
  <button id="closePopup">X</button>
  <img id="popupImage" src="" alt="">
</div>

<script>
  // OPEN popup
  document.getElementById('cornerBtn').onclick = function () {
    const overlay = document.getElementById('popupOverlay');
    const img = document.getElementById('popupImage');

    // IMPORTANT: This MUST be a direct image URL, not a link
    img.src = 'worksheet.jpg';

    overlay.style.display = 'flex';
  };

  // CLOSE popup
  document.getElementById('closePopup').onclick = function () {
    document.getElementById('popupOverlay').style.display = 'none';
  };
</script>
