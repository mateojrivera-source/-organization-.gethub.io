<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Top Right Popup</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      height: 100vh;
    }

    /* Top-right button */
    #cornerButton {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #2563eb;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    /* Dark background behind popup */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
    }

    /* Popup box */
    #popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #111827;
      padding: 20px;
      border-radius: 12px;
      width: 300px;
      display: none;
    }

    button {
      padding: 8px 12px;
      margin-top: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <button id="cornerButton">⋮</button>

  <div id="overlay"></div>

  <div id="popup">
    <h2>Popup</h2>
    <p>This is the popup content.</p>
    <button onclick="closePopup()">Close</button>
  </div>

  <script>
    const button = document.getElementById("cornerButton");
    const popup = document.getElementById("popup");
    const overlay = document.getElementById("overlay");

    button.onclick = () => {
      popup.style.display = "block";
      overlay.style.display = "block";
    };

    function closePopup() {
      popup.style.display = "none";
      overlay.style.display = "none";
    }
  </script>

</body>
</html>
